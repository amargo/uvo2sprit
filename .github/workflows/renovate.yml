name: Renovate
on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 02:00/03:00 Europe/Budapest -> bőven a renovate.json
    # "after 1am and before 5am" ablakon belül, DST-től függetlenül
    - cron: "0 1 * * *"
jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      security-events: read # This is needed for vulnerability alerts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v44.2.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}